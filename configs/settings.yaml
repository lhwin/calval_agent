# Cal/Val Agent Configuration
# Local GPF operator installation

# GPF Project Paths (local)
gpf_paths:
  base: "GPF"
  star_cross: "GPF/csv_glsy_alt_gdr_aux_sat_cal"
  self_cross: "GPF/02-星星自交叉法 v2.0/CVS_SELF_GLSY_ALT_GDR_AUX_SAT_CAL"
  tide_ext: "GPF/04-验潮站外推 v1.0/CVS_GLSY_ALT_GDR_AUX_YCZ_CAL"
  target: "GPF"

# Operator Settings
operators:
  star_cross:
    module: "csv_glsy_alt_gdr_aux_sat_cal"
    main: "main.py"
    func: "func_cross_cal_pro"
    min_samples: 100
    
  self_cross:
    module: "CVS_SELF_GLSY_ALT_GDR_AUX_SAT_CAL"
    main: "main.py"
    func: "func_cross_cal_pro"
    min_crossovers: 50
    
  tide_ext:
    module: "CVS_GLSY_ALT_GDR_AUX_YCZ_CAL"
    main: "main.py"
    func: "func_ycz_cal_pro"
    min_tide_stations: 1

# Quality Control Thresholds (from original GPF code)
qc_thresholds:
  swh_max: 15.0  # meters
  wind_speed_range: [2.0, 40.0]  # m/s
  outlier_threshold_cm: 15
  match_time_hours: 2.0
  distance_to_coast_km: 50
  ocean_depth_m: 1000
  lat_range: [-60, 60]
  lon_range: [-180, 180]

# Fallback Strategies
fallback:
  - action: "relax_match_time"
    value: 4.0  # hours
  - action: "reduce_coast_distance"
    value: 30.0  # km
  - action: "relax_outlier_threshold"
    value: 20.0  # cm
  - action: "expand_date_range"
    days: 7

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/calval_agent.log"
  
# Output
output:
  directory: "output"
  formats: ["json", "txt", "png", "npz"]
