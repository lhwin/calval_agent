# LLM Configuration for Intelligent Decision Making
# 智能决策所需的 LLM 配置

llm:
  # 提供商选择：openai | deepseek | anthropic | ollama | azure
  provider: "deepseek"
  
  # API Key (使用环境变量，不要直接写在这里)
  # 对应的环境变量名：DEEPSEEK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
  api_key_env: "DEEPSEEK_API_KEY"
  
  # API 端点
  base_url: "https://api.deepseek.com"  # DeepSeek
  # base_url: "https://api.openai.com/v1"  # OpenAI
  # base_url: "http://localhost:11434"  # Ollama 本地模型
  
  # 模型名称
  model_name: "deepseek-chat"
  # model_name: "gpt-4o-mini"  # OpenAI
  # model_name: "claude-3-haiku-20240307"  # Anthropic
  # model_name: "llama3.1"  # Ollama
  
  # 生成参数
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.9
  presence_penalty: 0.0
  frequency_penalty: 0.0
  
  # 超时设置（秒）
  timeout: 30
  max_retries: 3
  
  # 系统提示词（根据任务定制）
  system_prompt: |
    你是一个卫星高度计定标专家系统。根据提供的数据特征、卫星类型和时间范围，
    推荐最适合的定标方法并解释原因。
    
    可用方法：
    - 星间交叉 (star_cross): 适用于多星数据，检测卫星间系统性偏差
    - 星自交叉 (self_cross): 适用于单星数据，监测卫星轨道漂移
    - SIG0 交叉 (sig0_cross): 适用于回波强度定标
    - 验潮站参考 (tide_ext): 适用于绝对基准参考
    
    请根据数据质量和可用性做出合理推荐，如果数据不足请建议替代方案。

# 可选：多个模型配置（用于不同场景）
models:
  quick:
    provider: "deepseek"
    model_name: "deepseek-lite"  # 更快的响应
    temperature: 0.5
  
  accurate:
    provider: "deepseek"  
    model_name: "deepseek-chat"
    temperature: 0.7
    
  local:
    provider: "ollama"
    base_url: "http://localhost:11434"
    model_name: "llama3.1"